name: Build and release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ios/**"
      - "tools/**"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0). Created if it does not exist.
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Collect
        run: cp app/build/outputs/apk/debug/app-debug.apk remote-screen-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: remote-screen-debug.apk

  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Draw the app icon
        run: python3 tools/make_icon.py
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project RemoteScreen.xcodeproj \
            -scheme RemoteScreen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        working-directory: ios
        run: |
          rm -rf Payload RemoteScreen.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RemoteScreen.app Payload/
          zip -qry RemoteScreen.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/RemoteScreen.ipa

  release:
    needs: [apk, ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -z "$TAG" ]; then TAG="v1.0.${{ github.run_number }}"; fi
          NOTES="Android (com.projectbysketch.inputbridge): remote-screen-debug.apk, debug-signed and installable as is. Pairing-code mirroring, second display, and the remote shell on port 7003 with app/process control and APK push.
          iPhone receiver: RemoteScreen.ipa (unsigned: sideload it with AltStore, Sideloadly or TrollStore, which sign it with your Apple ID)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/apk/remote-screen-debug.apk dist/ipa/RemoteScreen.ipa --clobber
          else
            gh release create "$TAG" dist/apk/remote-screen-debug.apk dist/ipa/RemoteScreen.ipa \
              --target "$GITHUB_SHA" --title "Remote Screen $TAG" --notes "$NOTES"
          fi
