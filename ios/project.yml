name: RemoteScreen
options:
  bundleIdPrefix: com.projectbysketch
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RemoteScreen:
    type: application
    platform: iOS
    sources:
      - RemoteScreen
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Input Bridge
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Input Bridge connects to your paired Android phone on the local network.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectbysketch.inputbridge
        TARGETED_DEVICE_FAMILY: "1,2"
